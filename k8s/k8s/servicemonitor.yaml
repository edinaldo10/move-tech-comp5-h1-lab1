apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloud-application
  namespace: monitoring   # <--- Alterado de 'default' para 'monitoring'
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: cloud-application
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
